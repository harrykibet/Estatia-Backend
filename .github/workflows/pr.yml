name: Backend PR Verification

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [master]
    types: [checks_requested]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: backend-pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Backend Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --prefix functions

      - name: Run ESLint
        run: npm --prefix functions run lint

      - name: Type-check TypeScript
        run: npm --prefix functions run typecheck

      - name: Build and run unit tests
        run: npm --prefix functions test

      - name: Run Functions Emulator integration test
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --project demo-estatia-ci \
            --only functions \
            --non-interactive \
            "npm --prefix functions run test:emulator"

      - name: Retain compiled Functions output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-functions-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: functions/lib/
          if-no-files-found: ignore
          retention-days: 7
