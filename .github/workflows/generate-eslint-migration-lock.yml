name: Generate ESLint 10 migration lockfile

on:
  push:
    branches:
      - tooling/migrate-eslint10-typescript6

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate and validate Functions lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 for Firebase Emulator Suite
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use npm 11
        run: |
          npm install --global npm@11.21.3
          npm --version

      - name: Discard obsolete lockfile before regeneration
        run: rm -f functions/package-lock.json

      - name: Regenerate lockfile from manifest
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --prefix functions

      - name: Run ESLint
        run: npm --prefix functions run lint

      - name: Type-check TypeScript
        run: npm --prefix functions run typecheck

      - name: Build and run unit tests
        run: npm --prefix functions test

      - name: Run Functions, Auth, and Firestore Emulator integration tests
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --project demo-estatia-ci \
            --only functions,auth,firestore \
            --non-interactive \
            "npm --prefix functions run test:emulator"

      - name: Retain generated package-lock.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eslint10-typescript6-generated-lock
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 3
