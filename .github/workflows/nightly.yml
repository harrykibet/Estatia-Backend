name: Backend Nightly Verification

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: backend-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-verification:
    name: Full backend and emulator verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 for Firebase Emulator Suite
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --prefix functions

      - name: Run ESLint
        run: npm --prefix functions run lint

      - name: Type-check TypeScript
        run: npm --prefix functions run typecheck

      - name: Build and run unit tests
        run: npm --prefix functions test

      - name: Run Functions, Auth, and Firestore Emulator integration tests
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/firebase-emulator.log"
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --project demo-estatia-ci \
            --only functions,auth,firestore \
            --non-interactive \
            "npm --prefix functions run test:emulator" 2>&1 | tee "$log_file"

      - name: Upload nightly build and emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            functions/lib/
            ${{ runner.temp }}/firebase-emulator.log
          if-no-files-found: warn
          retention-days: 14
